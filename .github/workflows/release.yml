name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

env:
  TARGET: x86_64-unknown-linux-musl

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./check.sh
      - run: rustup target add "$TARGET"
      - run: cargo build --release --locked --target "$TARGET"
      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force origin HEAD:refs/tags/latest
          if ! gh release view latest >/dev/null; then
            gh release create latest --title latest --notes 'Built from the head of main.'
          fi
          cp "target/$TARGET/release/kairn" "kairn-$TARGET"
          gh release upload latest "kairn-$TARGET" --clobber
